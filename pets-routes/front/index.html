<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Link to add.html -->
    <a href="add.html">Add New Pet</a>

    <!-- Page heading -->
    <h1>Pets</h1>

    <!-- Filter buttons -->
    <div>
        <button class="filter-btn active" data-type="dog">Dog</button>
        <button class="filter-btn active" data-type="cat">Cat</button>
        <button class="filter-btn active" data-type="bunny">Bunny</button>
    </div>

    <!-- Pets table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th id="age-header">Age (asc)</th>
            </tr>
        </thead>
        <tbody id="pets-table-body">
            <!-- Data will be dynamically injected here -->
        </tbody>
    </table>

    <script src="index.js"></script>
</body>
</html>
