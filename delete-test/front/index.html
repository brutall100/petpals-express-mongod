<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users API Frontend</title>
</head>
<body>
  <h1>Users API Frontend</h1>

  <h2>Get All Users</h2>
  <button id="get-users">Fetch Users</button>
  <div id="users-list"></div>

  <h2>Add User</h2>
  <form id="add-user-form">
    <input type="text" name="name" placeholder="Name" required />
    <input type="text" name="surname" placeholder="Surname" />
    <input type="number" name="age" placeholder="Age" />
    <input type="email" name="email" placeholder="Email" required />
    <button type="submit">Add User</button>
  </form>

  <h2>Update User</h2>
  <form id="update-user-form">
    <input type="text" name="id" placeholder="User ID" required />
    <input type="text" name="name" placeholder="Name" />
    <input type="text" name="surname" placeholder="Surname" />
    <input type="number" name="age" placeholder="Age" />
    <input type="email" name="email" placeholder="Email" />
    <button type="submit">Update User</button>
  </form>

  <h2>Delete User</h2>
  <form id="delete-user-form">
    <input type="text" name="id" placeholder="User ID" required />
    <button type="submit">Delete User</button>
  </form>

  <h2>Patch User</h2>
  <form id="patch-user-form">
    <input type="text" name="id" placeholder="User ID" required />
    <input type="text" name="field" placeholder="Field (name, surname, age, email)" required />
    <input type="text" name="value" placeholder="New Value" required />
    <button type="submit">Patch User</button>
  </form>

  <script>
    const apiUrl = 'http://localhost:3000';

    document.getElementById('get-users').addEventListener('click', async () => {
      const response = await fetch(`${apiUrl}/users`);
      const users = await response.json();
      document.getElementById('users-list').innerHTML = JSON.stringify(users, null, 2);
    });

    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      const response = await fetch(`${apiUrl}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await response.json();
      alert(result.message || 'User added successfully!');
    });

    document.getElementById('update-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const { id, ...data } = Object.fromEntries(formData.entries());
      const response = await fetch(`${apiUrl}/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await response.json();
      alert(result.message || 'User updated successfully!');
    });

    document.getElementById('delete-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const { id } = Object.fromEntries(formData.entries());
      const response = await fetch(`${apiUrl}/users/${id}`, { method: 'DELETE' });
      const result = await response.json();
      alert(result.message || 'User deleted successfully!');
    });

    document.getElementById('patch-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const { id, field, value } = Object.fromEntries(formData.entries());
      const response = await fetch(`${apiUrl}/users/${id}/${field}/${value}`, {
        method: 'PATCH',
      });
      const result = await response.json();
      alert(result.message || 'User patched successfully!');
    });
  </script>
</body>
</html>
