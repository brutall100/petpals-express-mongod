<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Car Model</title>
</head>
<body>
    <h1>Add a Car Model</h1>
    <form id="add-car-form">
        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" required><br><br>
        <label for="model">Model:</label>
        <input type="text" id="model" name="model" required><br><br>
        <button type="submit">Add Model</button>
    </form>

    <script>
        document.getElementById('add-car-form').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent form reload

            const brand = document.getElementById('brand').value.toLowerCase();
            const model = document.getElementById('model').value;

            try {
                const response = await fetch(`http://localhost:3000/cars/${brand}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ model }), // Send the model in the request body
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(data.message);
                    document.getElementById('add-car-form').reset(); // Reset the form
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while adding the model.');
            }
        });
    </script>
</body>
</html>
